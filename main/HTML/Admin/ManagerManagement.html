<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manager Management</title>
    <link rel="icon" type="image/png" href="../../../resource/icon/logo_remove_BG.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <!-- Google Fonts -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono&display=swap">

    <!-- Material Symbols -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap">

    <!-- AAIR Tailwind Configuration -->
    <script src="../../JavaScript/tailwind.js"></script>

    <!-- Page-specific CSS -->
    <link href="../../Style/UserCreation.css" rel="stylesheet">

    <link href="../../Style/basic.css" rel="stylesheet">

</head>

<body class="bg-surface text-on-surface selection:bg-primary-container selection:text-on-primary-container">

    <!-- Fixed Header -->
    <header
        class="fixed top-0 left-0 right-0 h-[50px] bg-normal border-b border-outline-variant flex items-center px-2 z-50">

        <!-- AAIR Logo -->
        <div class="flex items-center gap-2 mr-6">
            <img src="/resource/icon/logo_remove_BG.png" alt="AAIR Lab Logo" class="h-8 w-auto">

            <h1 class="font-headline-sm text-[14px] font-bold text-primary">
                AAIR Lab
            </h1>
        </div>

        <div class="h-12 w-[1px] bg-outline-variant ms-2"></div>

        <nav class="flex items-center h-full">

            <a href="../../HTML/Admin/Dashboard.html" class="flex items-center gap-2 px-4 h-full
                   text-on-surface-variant
                   hover:text-text-hover
                   hover:bg-button-hover
                   transition-colors duration-200">

                <span class="material-symbols-outlined">
                    dashboard
                </span>

                <span class="font-body-md text-[12px]">
                    Dashboard
                </span>
            </a>

            <div class="h-12 w-[1px] bg-outline-variant"></div>

            <a href="../../HTML/Admin/ManagerManagement.html" class="flex items-center gap-2 px-4 h-full
                   text-text-active
                   bg-button-active
                   transition-colors duration-200">

                <span class="material-symbols-outlined">
                    group
                </span>

                <span class="font-body-md  text-[12px]">
                    Manager
                </span>
            </a>

            <div class="h-12 w-[1px] bg-outline-variant"></div>

            <a href="../../HTML/Admin/PermissionManagement.html" class="flex items-center gap-2 px-4 h-full
                   text-on-surface-variant
                   hover:text-text-hover
                   hover:bg-button-hover
                   transition-colors duration-200">

                <span class="material-symbols-outlined">
                    security_update_good
                </span>

                <span class="font-body-md  text-[12px]">
                    Permission
                </span>
            </a>

            <div class="h-12 w-[1px] bg-outline-variant"></div>

            <a href="../../HTML/Admin/LogView.html" class="flex items-center gap-2 px-4 h-full
                   text-on-surface-variant
                   hover:text-text-hover
                   hover:bg-button-hover
                   transition-colors duration-200">

                <span class="material-symbols-outlined">
                    history
                </span>

                <span class="font-body-md  text-[12px]">
                    Audit Logs
                </span>
            </a>

        </nav>

        <!-- User Profile -->
        <div class="ml-auto flex items-center gap-3">

            <div class="w-7 h-7 rounded-full
                   bg-primary-container/10
                   flex items-center justify-center
                   text-primary font-bold">
                A
            </div>

            <div class="hidden md:block">
                <p class="text-[12px] font-bold text-on-surface">
                    NV. A
                </p>
                <p class="text-[8px] text-on-surface-variant uppercase tracking-wider">
                    Admin
                </p>
            </div>

        </div>

    </header>

    <!-- TopNavBar -->
    <header class="w-full h-12
           flex items-center gap-2 px-lg
           bg-text-active border-b border-outline-variant
           shadow-sm sticky top-[58px] z-30 mb-6">

        <!-- Search Box - Left -->
        <div class="relative w-[280px]">

            <span class="material-symbols-outlined
                     absolute left-3 top-1/2
                     -translate-y-1/2
                     text-slate-400 text-[20px]">
                search
            </span>

            <input type="text" placeholder="Search ..." class="w-full h-8
                   pl-10 pr-4
                   rounded-lg
                   border border-slate-300
                   bg-white
                   text-sm
                   outline-none
                   focus:border-blue-500
                   focus:ring-2
                   focus:ring-blue-100">
        </div>

        <!-- Buttons -->
        <div class="ml-auto flex items-center gap-2">

            <div class="flex items-center gap-2">
                <label class="text-label-md text-on-surface-variant">Role:</label>
                <select
                    class="bg-surface border border-outline-variant rounded-lg px-3 py-1.5 text-body-sm font-medium focus:outline-none focus:ring-1 focus:ring-primary">
                    <option>All</option>
                    <option>Active</option>
                    <option>Disabled</option>
                </select>
            </div>
            <div class="flex items-center gap-2">
                <label class="text-label-md text-on-surface-variant">Status:</label>
                <select
                    class="bg-surface border border-outline-variant rounded-lg px-3 py-1.5 text-body-sm font-medium focus:outline-none focus:ring-1 focus:ring-primary">
                    <option>All</option>
                    <option>Core</option>
                    <option>Security Ops</option>
                    <option>Infrastructure</option>
                    <option>Data Ethics</option>
                </select>
            </div>

            <button class="px-4 py-2
                       rounded-lg
                       text-[12px]
                       bg-button-active
                       text-text-active
                       hover:opacity-85
                       transition-opacity
                       flex items-center gap-2 shadow-sm" onclick="toggleModal()">

                <span class="material-symbols-outlined text-[12px]">
                    add
                </span>

                New
            </button>

        </div>

    </header>

    <!-- Main Content Canvas -->
    <main class="w-full min-h-[calc(100vh-106px)] bg-surface pt-6">

        <div class="w-full px-6 py-6">

            <!-- Main Data Table Card -->
            <div class="bg-surface-container-lowest rounded-xl border border-outline-variant/30 shadow-sm overflow-hidden">
                <div class="overflow-x-auto">
                    <table id="managerUsersTable" class="w-full text-left border-collapse">
                        <thead class="bg-text-active border-b border-outline-variant">
                            <tr>
                                <th
                                    class="px-lg py-4 font-label-md text-on-surface-variant uppercase text-[11px] tracking-wider">
                                    No.
                                </th>
                                <th
                                    class="px-6 py-4 text-label-md text-on-surface-variant uppercase tracking-wider font-bold">
                                    UserName</th>
                                <th
                                    class="px-6 py-4 text-label-md text-on-surface-variant uppercase tracking-wider font-bold">
                                    Email</th>
                                <th
                                    class="px-6 py-4 text-label-md text-on-surface-variant uppercase tracking-wider font-bold">
                                    Team</th>
                                <th
                                    class="px-6 py-4 text-label-md text-on-surface-variant uppercase tracking-wider font-bold">
                                    Status</th>
                                <th
                                    class="px-6 py-4 text-label-md text-on-surface-variant uppercase tracking-wider font-bold">
                                    Created</th>
                                <th
                                    class="px-6 py-4 text-label-md text-on-surface-variant uppercase tracking-wider font-bold">
                                    Actions</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-outline-variant">

                        </tbody>
                    </table>
                </div>


                <!-- Pagination -->
                <div class="px-6 py-4
                        bg-text-active
                        border-t border-slate-200
                        flex items-center
                        justify-center">


                    <!-- Pagination -->
                    <div class="flex items-center gap-6">

                        <!-- Previous -->
                        <button class="w-9 h-9
                                    flex items-center justify-center
                                    rounded-lg
                                    text-slate-600
                                    hover:bg-slate-200
                                    hover:text-slate-900
                                    transition-colors duration-150">

                            <span class="material-symbols-outlined text-[20px]">
                                chevron_left
                            </span>

                        </button>


                        <!-- Page 1 -->
                        <button class="w-9 h-9
                                   rounded-lg
                                   bg-button-active
                                   text-text-active
                                   text-sm
                                   font-medium">
                            1
                        </button>


                        <!-- Page 2 -->
                        <button class="w-9 h-9
                                   rounded-lg
                                    text-slate-600
                                    hover:bg-slate-200
                                    hover:text-slate-900
                                    transition-colors duration-150">
                            2
                        </button>


                        <!-- Page 3 -->
                        <button class="w-9 h-9
                                   rounded-lg
                                    text-slate-600
                                    hover:bg-slate-200
                                    hover:text-slate-900
                                    transition-colors duration-150">
                            3
                        </button>


                        <!-- Page 4 -->
                        <button class="w-9 h-9
                                   rounded-lg
                                    text-slate-600
                                    hover:bg-slate-200
                                    hover:text-slate-900
                                    transition-colors duration-150">
                            4
                        </button>


                        <!-- Page 5 -->
                        <button class="w-9 h-9
                                   rounded-lg
                                    text-slate-600
                                    hover:bg-slate-200
                                    hover:text-slate-900
                                    transition-colors duration-150">
                            5
                        </button>


                        <!-- Page 6 -->
                        <button class="w-9 h-9
                                   rounded-lg
                                    text-slate-600
                                    hover:bg-slate-200
                                    hover:text-slate-900
                                    transition-colors duration-150">
                            6
                        </button>


                        <!-- Next -->
                        <button class="w-9 h-9
                                    flex items-center justify-center
                                    rounded-lg
                                    text-slate-600
                                    hover:bg-slate-200
                                    hover:text-slate-900
                                    transition-colors duration-150">

                            <span class="material-symbols-outlined text-[20px]">
                                chevron_right
                            </span>

                        </button>

                    </div>

                </div>

            </div>
        </div>
    </main>

    <!-- Create  -->
    <div class="fixed inset-0 bg-inverse-surface/40 backdrop-blur-sm z-[100] flex items-center justify-center transition-opacity duration-300 opacity-0 hidden"
        id="modalOverlay">
        <div class="glass-modal w-full max-w-2xl max-h-[90vh] rounded-2xl shadow-2xl overflow-hidden flex flex-col transition-transform duration-300 scale-95"
            id="modalContent">

            <!-- Modal Header -->
            <div class="px-8 py-6 border-b border-outline-variant flex justify-between items-center bg-white/50">
                <div>
                    <h3 class="font-headline-sm text-headline-sm text-on-surface">Create New Manager</h3>
                </div>
                <button
                    class="p-2 hover:bg-surface-container-low rounded-full transition-colors text-on-surface-variant"
                    onclick="toggleModal()">
                    <span class="material-symbols-outlined" data-icon="close">close</span>
                </button>
            </div>

            <!-- Modal Body -->
            <div class="flex-1 min-h-0 px-8 py-6 space-y-6 overflow-y-auto custom-scrollbar">

                <div class="grid grid-cols-2 gap-6">
                    <div class="space-y-1.5">
                        <label class="text-label-md text-on-surface-variant uppercase tracking-wider font-bold">
                            First Name</label>
                        <input
                            class="w-full px-4 py-2.5 rounded-lg border border-outline-variant bg-surface-container-lowest focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-body-md"
                            placeholder="e.g. John" type="text">
                    </div>
                    <div class="space-y-1.5">
                        <label class="text-label-md text-on-surface-variant uppercase tracking-wider font-bold">
                            Last Name</label>
                        <input
                            class="w-full px-4 py-2.5 rounded-lg border border-outline-variant bg-surface-container-lowest focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-body-md"
                            placeholder="e.g. Doe" type="text">
                    </div>
                </div>

                <div class="space-y-1.5">
                    <label class="text-label-md text-on-surface-variant uppercase tracking-wider font-bold">
                        Email Address
                    </label>
                    <input
                        class="w-full px-4 py-2.5 rounded-lg border border-outline-variant bg-surface-container-lowest focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-body-md"
                        placeholder="john.doe@aair.lab" type="email">
                </div>

                <!-- Assignment Section -->
                <div class="grid grid-cols-2 gap-6">
                    <div class="space-y-1.5">
                        <label
                            class="text-label-md text-on-surface-variant uppercase tracking-wider font-bold">Team</label>
                        <select
                            class="w-full px-4 py-2.5 rounded-lg border border-outline-variant bg-surface-container-lowest focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-body-md appearance-none">
                            <option>Select Team</option>
                            <option>Security Ops</option>
                            <option>Infrastructure</option>
                            <option>Data Ethics</option>
                        </select>
                    </div>
                </div>

            </div>

            <!-- Modal Footer -->
            <div class="px-8 py-6 border-t border-outline-variant flex justify-end gap-3 bg-white/50">
                <button
                    class="px-6 py-2.5 border border-outline-variant rounded-lg text-body-md font-bold text-on-surface-variant hover:bg-surface-container-low transition-all"
                    onclick="toggleModal()">
                    Cancel
                </button>
                <button
                    class="gradient-btn px-8 py-2.5 rounded-lg text-white font-bold text-body-md shadow-lg hover:opacity-90 active:scale-95 transition-all">
                    Create
                </button>
            </div>
        </div>
    </div>

    <script src="../../JavaScript/UserCreation.js"> </script>
    <script src="../../JavaScript/api.js"></script>
    <script src="../../JavaScript/workspace.js"></script>
</body>

</html>
