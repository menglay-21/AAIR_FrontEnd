<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>View ALL</title>
    <link rel="icon" type="image/png" href="/resource/icon/logo_remove_BG.png">

    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono&display=swap">

    <!-- Material Symbols -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <script src="../../../JavaScript/tailwind.js"></script>

    <link href="../../../Style/basic.css" rel="stylesheet" />

</head>

<body class="bg-surface text-on-surface selection:bg-primary-container selection:text-on-primary-container">

    <!-- Fixed Header -->
    <header
        class="fixed top-0 left-0 right-0 h-[50px] bg-normal border-b border-outline-variant flex items-center px-2 z-50">

        <!-- AAIR Logo -->
        <div class="flex items-center gap-2 mr-6">
            <img src="/resource/icon/logo_remove_BG.png" alt="AAIR Lab Logo" class="h-8 w-auto">

            <h1 class="font-headline-sm text-[14px] font-bold text-primary">
                AAIR Lab
            </h1>
        </div>

        <div class="h-12 w-[1px] bg-outline-variant ms-2"></div>

        <!-- Navigation -->
        <nav class="flex items-center h-full">

            <a class="flex items-center gap-2 px-4 h-full
                   text-on-surface-variant
                   hover:text-text-hover
                   hover:bg-button-hover
                   transition-colors duration-200" href="../../User/ManualLabeling/Dashboard.html">
                <span class="material-symbols-outlined" data-icon="dashboard">dashboard</span>
                <span class="font-body-md text-[12px]">Dashboard</span>
            </a>

            <div class="h-12 w-[1px] bg-outline-variant"></div>

            <a class="flex items-center gap-2 px-4 h-full
                   text-text-active
                   bg-button-active
                   transition-colors duration-200" href="../../User/ManualLabeling/ViewAll.html">
                <span class="material-symbols-outlined">list_alt </span>
                <span class="font-body-md text-[12px]">View ALL</span>
            </a>

            <div class="h-12 w-[1px] bg-outline-variant"></div>

            <a class="flex items-center gap-2 px-4 h-full
                   text-on-surface-variant
                   hover:text-text-hover
                   hover:bg-button-hover
                   transition-colors duration-200" href="../../User/ManualLabeling/Task.html">
                <span class="material-symbols-outlined">edit_note</span>
                <span class="font-body-md text-[12px]">Session</span>
            </a>

            <div class="h-12 w-[1px] bg-outline-variant"></div>

        </nav>

        <!-- User Profile -->
        <div class="ml-auto flex items-center gap-3">

            <div class="w-7 h-7 rounded-full
                   bg-primary-container/10
                   flex items-center justify-center
                   text-primary font-bold">
                B
            </div>

            <div class="hidden md:block">
                <p class="text-[12px] font-bold text-on-surface">
                    NV. B
                </p>
                <p class="text-[8px] text-on-surface-variant uppercase tracking-wider">
                    Manual labeling
                </p>
            </div>

        </div>

    </header>

    <!-- TopNavBar -->
    <header class="w-full h-12
           flex items-center gap-2 px-lg
           bg-text-active border-b border-outline-variant
           shadow-sm sticky top-[50px] z-30 mb-6">

        <!-- Search Box - Left -->
        <div class="relative w-[280px]">

            <span class="material-symbols-outlined
                     absolute left-3 top-1/2
                     -translate-y-1/2
                     text-slate-400 text-[20px]">
                search
            </span>

            <input id="taskSearch" type="search" placeholder="Search ..." class="w-full h-8
                   pl-10 pr-4
                   rounded-lg
                   border border-slate-300
                   bg-white
                   text-sm
                   outline-none
                   focus:border-blue-500
                   focus:ring-2
                   focus:ring-blue-100">
        </div>

        <!-- Buttons -->
        <div class="ml-auto flex items-center gap-2">

            <div class="flex items-center gap-2">
                <label for="taskSessionFilter" class="text-label-md text-on-surface-variant">Session:</label>
                <select id="taskSessionFilter"
                    class="bg-surface border border-outline-variant rounded-lg px-3 py-1.5 text-body-sm font-medium focus:outline-none focus:ring-1 focus:ring-primary">
                    <option value="">All</option>
                </select>
            </div>

            <div class="flex items-center gap-2">
                <label for="taskStatusFilter" class="text-label-md text-on-surface-variant">Status:</label>
                <select id="taskStatusFilter"
                    class="bg-surface border border-outline-variant rounded-lg px-3 py-1.5 text-body-sm font-medium focus:outline-none focus:ring-1 focus:ring-primary">
                    <option value="">All</option>
                </select>
            </div>

        </div>

    </header>

    <main class="w-full min-h-[calc(100vh-98px)] bg-surface pt-4">


        <!-- ===================================================== -->
        <!-- PAGE CONTENT -->
        <!-- ===================================================== -->

        <section class="p-8">

            <!-- ================================================= -->
            <!-- SESSION TABLE -->
            <!-- ================================================= -->

            <div class="bg-white
                        border border-slate-200
                        rounded-xl
                        overflow-hidden">

                <!-- Table -->
                <div class="overflow-x-auto">

                    <table id="taskTable" class="w-full text-sm">

                        <!-- Table Header -->
                        <thead class="bg-text-active
                                      border-b border-slate-200">

                            <tr>

                                <th class="px-6 py-4
                                           text-left
                                           font-semibold
                                           text-slate-600">
                                    Document
                                </th>

                                <th class="px-6 py-4
                                           text-left
                                           font-semibold
                                           text-slate-600">
                                    Session
                                </th>

                                <th class="px-6 py-4
                                           text-left
                                           font-semibold
                                           text-slate-600
                                           min-w-[180px]">
                                    Annotator
                                </th>

                                <th class="px-6 py-4
                                           text-left
                                           font-semibold
                                           text-slate-600">
                                    Type
                                </th>

                                <th class="px-6 py-4
                                           text-left
                                           font-semibold
                                           text-slate-600">
                                    Status
                                </th>

                                <th class="px-6 py-4
                                           text-left
                                           font-semibold
                                           text-slate-600">
                                    Due
                                </th>

                                <th class="px-6 py-4
                                           text-right
                                           font-semibold
                                           text-slate-600">
                                    Action
                                </th>

                            </tr>

                        </thead>


                        <!-- Table Body -->
                        <tbody id="taskRows" class="divide-y divide-slate-100">
                            <tr hidden aria-hidden="true"><td class="px-6 py-4"></td><td class="px-6 py-4"></td><td class="px-6 py-4"></td><td class="px-6 py-4"></td><td class="px-6 py-4"></td><td class="px-6 py-4"></td><td class="px-6 py-4"></td></tr>
                        </tbody>

                    </table>

                </div>


                <!-- ================================================= -->
                <!-- PAGINATION -->
                <!-- ================================================= -->

                <div class="px-6 py-4
                        bg-text-active
                        border-t border-slate-200
                        flex items-center
                        justify-center">


                    <!-- Pagination -->
                    <div id="taskPagination" class="flex items-center gap-6">

                        <!-- Previous -->
                        <button class="w-9 h-9
                                    flex items-center justify-center
                                    rounded-lg
                                    text-slate-600
                                    hover:bg-slate-200
                                    hover:text-slate-900
                                    transition-colors duration-150">

                            <span class="material-symbols-outlined text-[20px]">
                                chevron_left
                            </span>

                        </button>


                        <!-- Page 1 -->
                        <button class="w-9 h-9
                                   rounded-lg
                                   bg-button-active
                                   text-text-active
                                   text-sm
                                   font-medium">
                            1
                        </button>


                        <!-- Page 2 -->
                        <button class="w-9 h-9
                                   rounded-lg
                                    text-slate-600
                                    hover:bg-slate-200
                                    hover:text-slate-900
                                    transition-colors duration-150">
                            2
                        </button>


                        <!-- Page 3 -->
                        <button class="w-9 h-9
                                   rounded-lg
                                    text-slate-600
                                    hover:bg-slate-200
                                    hover:text-slate-900
                                    transition-colors duration-150">
                            3
                        </button>


                        <!-- Page 4 -->
                        <button class="w-9 h-9
                                   rounded-lg
                                    text-slate-600
                                    hover:bg-slate-200
                                    hover:text-slate-900
                                    transition-colors duration-150">
                            4
                        </button>


                        <!-- Page 5 -->
                        <button class="w-9 h-9
                                   rounded-lg
                                    text-slate-600
                                    hover:bg-slate-200
                                    hover:text-slate-900
                                    transition-colors duration-150">
                            5
                        </button>


                        <!-- Page 6 -->
                        <button class="w-9 h-9
                                   rounded-lg
                                    text-slate-600
                                    hover:bg-slate-200
                                    hover:text-slate-900
                                    transition-colors duration-150">
                            6
                        </button>


                        <!-- Next -->
                        <button class="w-9 h-9
                                    flex items-center justify-center
                                    rounded-lg
                                    text-slate-600
                                    hover:bg-slate-200
                                    hover:text-slate-900
                                    transition-colors duration-150">

                            <span class="material-symbols-outlined text-[20px]">
                                chevron_right
                            </span>

                        </button>

                    </div>

                </div>

            </div>

        </section>

    </main>

    <script src="../../../JavaScript/api.js"></script>
    <script src="../../../JavaScript/workspace.js"></script>
</body>

</html>
