server:
  port: ${SERVER_PORT:8080}

spring:
  config:
    import: optional:classpath:application-ai-keys.yml
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 51MB
  application:
    name: aair-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aair_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:17092005}
    driver-class-name: org.postgresql.Driver
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:qan3650@gmail.com}
    password: ${MAIL_PASSWORD:qszggdgaajnywsgo}
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
          starttls:
            enable: true
            required: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Ho_Chi_Minh

app:
  mail:
    from: ${MAIL_FROM:qan3650@gmail.com}
  storage:
    directory: ${UPLOAD_DIRECTORY:./uploads}
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  jwt:
    # Khi triển khai thật, bắt buộc đặt biến môi trường JWT_SECRET có ít nhất 32 ký tự.
    secret: ${JWT_SECRET:AAIR-Development-JWT-Secret-Must-Change-2026}
    expiration-ms: ${JWT_EXPIRATION_MS:28800000}
